name: Build Delivery Navi APK

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild embedded app files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p delivery-navi/android/app/src/main/assets/www
          mkdir -p delivery-navi/android/app/src/main/res/drawable
          cat \
            delivery-navi/data/html64.part00 \
            delivery-navi/data/html64.part01 \
            delivery-navi/data/html64.part02 \
            delivery-navi/data/html64.part03a \
            delivery-navi/data/html64.part03b \
            delivery-navi/data/html64.part03c \
            delivery-navi/data/html64.part04 \
            delivery-navi/data/html64.part05a \
            delivery-navi/data/html64.part05b \
            | base64 -d | xz -d > delivery-navi/android/app/src/main/assets/www/index.html
          base64 -d delivery-navi/data/icon-small.b64 > delivery-navi/android/app/src/main/res/drawable/app_icon.jpg
          test -s delivery-navi/android/app/src/main/assets/www/index.html
          grep -q "calculateOptimizedRoute" delivery-navi/android/app/src/main/assets/www/index.html
          file delivery-navi/android/app/src/main/res/drawable/app_icon.jpg

      - name: Build installable debug APK
        working-directory: delivery-navi/android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          set -euxo pipefail
          APK=delivery-navi/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          cp "$APK" DeliveryNavi-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryNavi-Android-APK
          path: DeliveryNavi-Android.apk
          if-no-files-found: error
